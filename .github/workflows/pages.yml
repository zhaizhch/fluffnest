name: GitHub Pages (web try-on)

# Publish the 暖卡卡 browser demo to https://zhaizhch.github.io/fluffnest/
on:
  push:
    branches: [main]
    paths:
      - "src/demo/**"
      - "src/pet/**"
      - "src/lib/**"
      - "demo.html"
      - "vite.demo.config.ts"
      - "scripts/build-web-demo.sh"
      - "public/pets/kaka-5/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build try-on (site + pages)
        run: npm run demo:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/web-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
